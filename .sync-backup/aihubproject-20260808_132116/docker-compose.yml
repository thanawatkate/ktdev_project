version: '3.9'

services:
  api:
    build: .
    ports:
      - '3400:3400'
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: aihub_db
      DB_USER: aihub_user
      DB_PASSWORD: aihub_pass
      ADMIN_SECRET: ${ADMIN_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    command: npm run dev

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: aihub_db
      MYSQL_USER: aihub_user
      MYSQL_PASSWORD: aihub_pass
    ports:
      - '3307:3306'
    volumes:
      - aihub_db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aihub_db_data:
